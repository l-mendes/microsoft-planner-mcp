name: Test and Release on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    name: Update changelog and create release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout default branch with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update changelog from tag
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python <<'PY'
          from datetime import date
          from pathlib import Path
          import subprocess
          import os

          tag = os.environ["TAG_NAME"]
          changelog_path = Path("CHANGELOG.md")

          prev_tag_cmd = ["bash", "-lc", f"git tag --sort=-creatordate | grep -v '^{tag}$' | head -n 1"]
          prev_tag = subprocess.run(prev_tag_cmd, capture_output=True, text=True).stdout.strip()

          if prev_tag:
            log_range = f"{prev_tag}..{tag}"
          else:
            log_range = tag

          commits = subprocess.run(
            ["git", "log", "--pretty=format:- %s (%h)", log_range],
            capture_output=True,
            text=True,
            check=False,
          ).stdout.strip()

          if not commits:
            commits = "- Initial release"

          section = f"## [{tag}] - {date.today().isoformat()}\n\n### Changed\n{commits}\n"

          if changelog_path.exists():
            content = changelog_path.read_text(encoding="utf-8")
          else:
            content = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n## [Unreleased]\n\n"

          if f"## [{tag}]" in content:
            print("Changelog already contains this tag section.")
            section_for_output = section
          else:
            unreleased_marker = "## [Unreleased]"
            if unreleased_marker in content:
              updated = content.replace(unreleased_marker, f"{unreleased_marker}\n\n{section}", 1)
            else:
              updated = content.rstrip() + "\n\n" + section + "\n"

            changelog_path.write_text(updated, encoding="utf-8")
            print("Changelog updated.")
            section_for_output = section

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
            with open(github_output, "a", encoding="utf-8") as fh:
              fh.write("release_notes<<EOF\n")
              fh.write(section_for_output)
              fh.write("EOF\n")
          PY

      - name: Commit changelog updates
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog update required for this tag."
          else
            git add CHANGELOG.md
            git commit -m "chore(changelog): update for ${{ github.ref_name }}"
            git push origin ${{ github.event.repository.default_branch }}
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ${{ steps.changelog.outputs.release_notes }}
